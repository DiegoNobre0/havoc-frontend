<div class="ui-confirm-dialog">
  <div class="ui-confirm-dialog__icon" [ngClass]="data.isDanger ? 'is-danger' : 'is-info'">
    <lucide-icon [name]="data.isDanger ? 'alert-triangle' : 'help-circle'"></lucide-icon>
  </div>

  <h2 class="ui-confirm-dialog__title">{{ data.title }}</h2>
  <p class="ui-confirm-dialog__text" [innerHTML]="data.message"></p>

  <div class="ui-confirm-dialog__actions">
    <button type="button" (click)="onCancel()" class="ui-btn ui-btn--secondary">
      {{ data.cancelText || 'Cancelar' }}
    </button>

    <button
      type="button"
      (click)="onConfirm()"
      class="ui-btn ui-btn--primary"
      [class.ui-btn--danger]="data.isDanger"
    >
      <lucide-icon class="action-icon" [name]="data.isDanger ? 'trash-2' : 'check'"></lucide-icon>
      {{ data.confirmText || 'Confirmar' }}
    </button>
  </div>
</div>
